# Vertical slice — architecture_devis_reprise (fictional; validation-only).
contract_id: vertical.devis-reprise.task-contract
title: Prepare a governed opinion on a complementary quote (devis complémentaire)
intent: From the project dossier, prepare a candidate opinion on the contractor's
  complementary quote and a draft MOA email — without approving the quote or sending
  anything.
scope:
