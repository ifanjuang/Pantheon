  - project dossier
  - the complementary quote
  - prior signed amendment
  excluded:
  - submit
  - sign
  - send email
  - approve payment
  authority_limits:
  - candidate opinion only
  - no external commitment
  - no client instruction
  expected_domain: architecture
owner_role: HEPHAISTOS
role_viewpoints:
- ATHENA
- THEMIS
- APOLLO
- HEPHAISTOS
constraints:
- Preserve OpenWebUI exposes, Hermes Agent executes, Pantheon Next governs.
- Do not add execution, scheduling, provider routing or memory promotion semantics.
- Keep schemas as validation contracts only.
approval_level: C3
requested_by: human-owner
created_at: '2026-05-17T20:00:00Z'
reasoning_topology:
