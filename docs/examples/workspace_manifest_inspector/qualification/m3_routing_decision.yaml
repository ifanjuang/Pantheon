information_carrier:
  m2_shape: information[]
  posture: candidate_workspace_metadata_only
  production_persistence_adopted: false
  reason: >-
    M2 proves heterogeneous annotations, anchors and navigation references are
    expressible, but does not establish a production sidecar owner, write
    lifecycle or authority contract. Preserve the candidate without promoting
    it into a second semantic persistence path.

scope_carrier:
  posture: candidate_source_metadata_only
  production_persistence_adopted: false
  reason: >-
    M2 proves partial source scope is necessary context. It does not prove that
    document.yaml must own that scope rather than reuse or compose current
    document/project owners when a production sidecar is eventually admitted.

semantic_boundary:
