  routing_resolution_is_not_profile_admission: true
  binding_selection_is_not_capability_adoption: true
  analysis_success_is_not_candidate_application: true
  projection_is_not_persistence: true
  semantic_promotion_path: canonical_observation_bundle

existing_downstream_contracts:
  document_structure:
    contract: schemas/document_knowledge_slice.schema.yaml
    contract_status: candidate_support_schema_implemented_external_persistence_not_adopted
    role: derived_document_structure_and_chunks
    copy_into_sidecar: false
  project_semantics:
    contract: schemas/architecture-project-understanding/observation_bundle.schema.yaml
    role: candidate_semantic_exchange_into_project_anatomy
