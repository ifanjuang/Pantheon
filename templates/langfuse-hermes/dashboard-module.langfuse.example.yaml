# Dashboard module manifest candidate for Langfuse observability
# Status: template candidate. Not an executable schema.
# First-test posture: link-only, health-only, synthetic-trace refs only.

module:
  id: observability.langfuse
  name: Langfuse Observability
  owner_layer: exposure_surface
  type: dashboard_external_link
  status: candidate

activation:
  state: to_configure
  scope: organization

authority:
  may_display: true
  may_link_out: true
  may_show_health: true
  may_show_trace_refs: synthetic_only
  may_capture_decision: false
  may_execute: false
  may_approve: false
  may_promote_memory: false
  may_create_evidence_pack: false
  may_send_external_action: false

configuration:
  ui_url: http://localhost:3000
  health_url: http://localhost:3000/api/public/health
  open_ui_action: external_link
  embedded_view:
    enabled: false
    status: refused_for_first_test
    reason: authentication, clickjacking, redaction and client-data visibility must be reviewed first
  trace_visibility:
    mode: synthetic_refs_only
    client_dossier_traces: refused_until_redaction_review
  retention:
    first_test_days: 7

card:
  title: Observabilité — Langfuse
  subtitle: Trace runtime only. Not proof, approval or memory.
  primary_action: Ouvrir Langfuse
  secondary_action: Vérifier santé
  warning: Une trace réussie ne valide pas le résultat.

visible_fields:
  - configured
  - health
  - ui_url
  - last_synthetic_trace_refs
  - runtime_task_status
  - governance_result_status
  - embedded_view
  - trace_visibility

status_vocabulary:
  health:
    - unknown
    - reachable
    - degraded
    - unavailable
  runtime_task_status:
    - not_started
    - success
    - partial
    - failed
    - blocked
    - unknown
  governance_result_status:
    - candidate
    - to_verify
    - approved
    - rejected
    - blocked

forbidden_collapses:
  - langfuse_trace_equals_proof
  - langfuse_score_equals_validation
  - runtime_success_equals_approval
  - dashboard_link_equals_authorization
  - trace_available_equals_evidence_pack
  - health_reachable_equals_governance_validated
  - synthetic_trace_success_equals_client_ready
