# Capability Passport Template
# Status: template — non-executable.
# Repo state: documented non-implemented.
# This template mirrors schemas/capability_passport.schema.yaml.
# It classifies a capability before use and authorizes nothing by itself.

passport_id: ""
status: candidate # candidate | reviewed | suspended | rejected
reviewed_at: null
reviewed_by: null

# Optional exact implementation/release provenance.
# A reviewed eligibility posture should pin at least one immutable anchor:
# commit_ref, content_digest or package_digest.
implementation_provenance:
  source_kind: repository # repository | package | agent_plugin | local | mcp_server | other
  source_ref: ""
  repository_ref: ""
  commit_ref: ""
  content_digest: "" # sha256:<64 lowercase hex>
  package_name: ""
  package_version: ""
  package_digest: "" # sha256:<64 lowercase hex>
  component_id: ""
  component_kind: ""
  component_ref: ""
  observed_at: ""

# Optional MCP-specific binding metadata. Omit for non-MCP capabilities.
mcp_server:
  server_id: ""
  server_name: ""
  canonical_uri: ""
  transport: other # stdio | http | other
  protocol_revision: ""
  source: ""
  trust_level: unknown # trusted | internal | external | unknown
  authorization_model: unknown # none | environment | oauth | custom | unknown

capability:
  primitive: tool # resource | prompt | tool | skill
  name: ""
  description_snapshot: ""
  description_hash: ""
  annotations_snapshot: ""
  icons_reviewed: not_applicable # yes | no | not_applicable

operation:
  reads_private_data: unknown # "true" | "false" | unknown
  writes_external_state: unknown
  can_execute_code: unknown
  can_send_to_external_party: unknown
  can_change_register: unknown
  can_promote_memory: unknown
  can_commit_professional_position: unknown # none | low | medium | high | critical | unknown

governance:
  activation_state: detected # detected | candidate | reviewed | suspended | rejected
  task_authorization: unauthorized # unauthorized | task_authorized
  allowed_scopes: []
  forbidden_scopes: []
  risk_level: medium # low | medium | high | critical
  approval_required: C2 # C0 | C1 | C2 | C3 | C4 | C5
  memory_behavior: candidate_only # none | candidate_only | never_canonical
  evidence_required: []
  context_minimization_required: true
  user_decision_gate_required: true

interface:
  allowed_inputs: []
  allowed_outputs: []
  forbidden_outputs: []
  required_envelope: task_contract_in__candidate_out__evidence_pack_out

result_handling:
  default_output_status: candidate # draft | candidate | to_verify | blocked
  evidence_pack_required: true
  raw_result_never_final: true
  permitted_register_output: none # none | register_candidate_only

revocation:
  status: active # active | suspended | revoked
  reason: ""
  review_after: null

notes:
  accepted: []
  refused: []
  to_verify: []
  to_arbitrate: []

governance_refs:
  - docs/governance/UNIFORM_CAPABILITY_GOVERNANCE.md
  - docs/governance/CAPABILITY_REGISTRY.md
  - mcp-server/docs/HTTP_API_CONTRACT.md
