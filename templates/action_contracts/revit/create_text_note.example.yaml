# Example Action Contract for the future Pantheon Revit Gate add-in.
# Documentation only. Non-executable example. The plugin does not exist.
# See docs/governance/PANTHEON_REVIT_GATE_DEVELOPER_DOSSIER.md (section 12).
#
# An Action Contract is the only thing the add-in would accept: a structured,
# governed request, never a free intention. This file is a sample and is not
# read by any runtime in this repository.

schema_version: "0.1-draft"
contract_id: ACT-REVIT-0001
