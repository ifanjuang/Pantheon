$schema: "https://json-schema.org/draft/2020-12/schema"
title: Pantheon Hermes Distribution Lock
description: Template-only composition lock for an external Hermes installation. It records one reviewed Pantheon monorepo baseline and exact component digests without installing, activating or authorizing them.
type: object
required:
  - schema_id
  - revision
  - distribution_id
  - status
  - source_pins
  - components
  - required_checks
  - state
  - authority
  - governance_refs
properties:
  schema_id:
    const: pantheon.hermes_distribution_lock
  revision:
    const: 3
  distribution_id:
    type: string
    pattern: "^[a-z0-9._-]+$"
  status:
    type: string
    enum:
      - candidate
      - observed
      - qualified
      - retired
  source_pins:
    type: object
    required:
      - pantheon_repository
      - hermes_runtime
    properties:
      pantheon_repository:
        $ref: "#/$defs/repositoryPin"
      hermes_runtime:
        $ref: "#/$defs/runtimePin"
    additionalProperties: false
  components:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: object
      required:
        - component_id
        - kind
        - path
        - digest_mode
        - content_digest
        - required
        - enabled_by_default
        - capabilities
      properties:
        component_id:
          type: string
          pattern: "^[a-z0-9._-]+$"
        kind:
          type: string
          enum:
            - run_binding
            - context_bridge
            - runtime_observer
            - skill
            - policy_mcp
            - dashboard
            - profile
            - configuration
        path:
          type: string
          minLength: 1
          pattern: "^(?!/)(?!.*\\.\\.).+$"
        digest_mode:
          type: string
          enum:
            - file
            - tree
        content_digest:
          type: string
          pattern: "^sha256:[a-f0-9]{64}$"
        required:
          type: boolean
        enabled_by_default:
          type: boolean
        capabilities:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            pattern: "^[a-z0-9._-]+$"
        notes:
          type: string
      additionalProperties: false
  required_checks:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: object
      required:
        - check_id
        - kind
        - required
      properties:
        check_id:
          type: string
          pattern: "^[a-z0-9._-]+$"
        kind:
          type: string
          enum:
            - static_structure
            - artifact_integrity
            - route_contract
            - plugin_contract
            - end_to_end
            - no_authority
        required:
          const: true
        command:
          type: string
        expected:
          type: string
      additionalProperties: false
  state:
    type: object
    required:
      - installation_state
      - activation_state
      - task_authorization_state
      - acceptance_state
    properties:
      installation_state:
        type: string
        enum:
          - not_observed
          - partially_observed
          - installed_observed
      activation_state:
        const: not_activated
      task_authorization_state:
        const: not_authorized
      acceptance_state:
        type: string
        enum:
          - not_run
          - passed
          - failed
          - inconclusive
      observation_refs:
        type: array
        uniqueItems: true
        items:
          type: string
    additionalProperties: false
  authority:
    type: object
    required:
      - installs_components
      - activates_binding
      - authorizes_tasks
      - dispatches_runs
      - accepts_results
      - admits_evidence
    properties:
      installs_components:
        const: false
      activates_binding:
        const: false
      authorizes_tasks:
        const: false
      dispatches_runs:
        const: false
      accepts_results:
        const: false
      admits_evidence:
        const: false
    additionalProperties: false
  governance_refs:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
allOf:
  - if:
      properties:
        status:
          enum:
            - observed
            - qualified
      required:
        - status
    then:
      properties:
        source_pins:
          properties:
            hermes_runtime:
              properties:
                artifact_digest:
                  type: string
                  pattern: "^sha256:[a-f0-9]{64}$"
              required:
                - artifact_digest
$defs:
  repositoryPin:
    type: object
    required:
      - repository
      - ref
    properties:
      repository:
        type: string
        pattern: "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"
      ref:
        type: string
        pattern: "^[a-f0-9]{40}$"
    additionalProperties: false
  runtimePin:
    type: object
    required:
      - runtime_id
      - version
      - artifact_digest
      - observation_ref
    properties:
      runtime_id:
        type: string
        minLength: 1
      version:
        type: string
        description: Exact reviewed runtime version; ranges, wildcards and trailing plus signs are forbidden.
        pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+(?:-[0-9A-Za-z.-]+)?$"
      artifact_digest:
        description: Exact installed runtime artifact digest. It remains null until an installation is observed.
        oneOf:
          - type: string
            pattern: "^sha256:[a-f0-9]{64}$"
          - type: "null"
      observation_ref:
        type: string
        minLength: 1
    additionalProperties: false
additionalProperties: false
x-boundary:
  governed_identity: false
  runtime_execution: false
  installation: false
  activation: false
  task_authorization: false
  dispatch: false
  provider_routing: false
  scheduler: false
  queue_system: false
  plugin_manager: false
  memory_promotion: false
  evidence_admission: false
