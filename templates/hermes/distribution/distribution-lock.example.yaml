required_checks:
  - check_id: component-paths
    kind: static_structure
    required: true
    expected: Every declared component resolves inside the reviewed Pantheon monorepo checkout.
  - check_id: component-digests
    kind: artifact_integrity
    required: true
    expected: Every component digest matches the deterministic file or tree digest algorithm.
  - check_id: bounded-routes
    kind: route_contract
    required: true
    expected: The adapter uses only stable Pantheon routes and the reviewed external Hermes Runs API.
  - check_id: composed-read-only-run
    kind: end_to_end
    required: true
    expected: One admitted read-only run can launch, read exact context and return a candidate without automatic mutation or Evidence admission.
  - check_id: no-authority-collapse
    kind: no_authority
    required: true
    expected: Installation and acceptance do not activate a binding or authorize a task.
