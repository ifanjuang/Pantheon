# Non-executable connection reference template.
# This is not an installed connection; it records how OpenWebUI reaches Hermes.

template_id: hermes_openai_connection
owner_layer: openwebui
status: candidate_template_only
purpose: >
  Record the OpenAI-compatible connection OpenWebUI uses to reach the external Hermes
  Agent runtime. Pantheon governs; it neither installs nor runs this connection.

upstream_reference_versions:
  hermes_agent: "0.18.0 (2026.7.1)"   # NousResearch/hermes-agent
  open_webui: "0.10.2"

hermes_side_config:               # run on the Hermes host, outside this repo
  - hermes config set API_SERVER_ENABLED true
  - hermes config set API_SERVER_KEY <secret>
  - hermes config set API_SERVER_PORT 8642
  - hermes gateway                 # starts the API server / messaging gateway

openwebui_connection:             # add as an OpenAI-compatible provider
  base_url: http://host.docker.internal:8642/v1   # server-to-server; no CORS needed
  api_key_ref: <same secret as API_SERVER_KEY>
  auth: bearer
  endpoints_used: [GET /v1/models, POST /v1/chat/completions]
  health_probe_to_verify: GET /health             # confirm against the actual Hermes runtime before operational use
  env_hints:
    ENABLE_OLLAMA_API: "false"     # reduce model-list clutter (optional)

governed_note:
  - The transport is OpenAI-compatible; the governed envelope (Task Contract,
    Evidence Pack, gates) is carried in the payload, not in the transport.
  - Pantheon holds no key and runs no connection; secrets live on the operator's host.
  - The health probe is a candidate operator check only. It is not Pantheon monitoring
    and does not establish runtime health truth by itself.

forbidden:
  - store_api_key_in_repo
  - execute_connection_from_pantheon
