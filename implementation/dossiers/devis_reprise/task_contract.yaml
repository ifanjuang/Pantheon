# Task Contract du dossier fictif devis_reprise — bloc 1.
# Conforme à Pantheon-Next schemas/mvp_governed_loop_objects.schema.yaml (task_contract).
# Un contrat n'autorise rien par lui-même ; le gate décide.
# declared_sources borne le périmètre de ce test ; il ne décide pas l'applicabilité professionnelle.

object_type: task_contract
object_id: mvp.devis-reprise.tc-001
contract_id: mvp.devis-reprise.tc-001
status: candidate
created_at: "2026-07-08T09:00:00Z"
requested_by: practitioner

intent:
  summary: >
    Analyser le devis de reprise Q-2026-041 (lot 06) par rapport aux sources
    sélectionnées du dossier et signaler uniquement les points nécessitant
    l'attention du maître d'œuvre. Le résultat reste un candidat de revue : il
    ne valide, n'accepte ni n'approuve aucun périmètre par lui-même.
  method_projection:
    authority_ref: docs/domain-packs/architecture/DOCUMENT_REVIEW.md
    status: task_scoped_non_authoritative_projection
    use_case: cctp_quote_comparison
    acceptable_claim_types:
      - missing_item
      - contradiction
      - ambiguity
      - variant_detected
      - exclusion_detected
      - scope_shift
      - quantity_mismatch
      - deadline_or_phase_risk
      - approval_needed
      - contractor_question_needed
      - client_arbitration_needed
    requirements:
      - preserve exact selected source and fragment references for material claims
      - use at least one CCTP fragment and one quote or DPGF fragment for a material comparison claim, or state explicitly that the matching quote fragment was not found
      - preserve contradictions and missing evidence instead of resolving them by inference
      - keep version uncertainty visible and route consequential conclusions to human review
    default_recommended_status: requires_human_review
    forbidden_outputs:
      - quote compliant
      - quote non-compliant
      - contractor selected
      - service order ready to send
      - client decision made
      - memory promoted

scope:
  dossier: devis_reprise
  declared_sources:
    - source_ref: dossiers/devis_reprise/sources/client_email_2026-07-05.md
    - source_ref: dossiers/devis_reprise/sources/quote_Q-2026-041.md
    - source_ref: dossiers/devis_reprise/sources/cctp_excerpt_lot06.md
    - source_ref: dossiers/devis_reprise/sources/dpgf_lot06.md
  operations:
    - read_selected_sources
    - retrieve_scoped_passages
    - prepare_result_candidate
    - prepare_evidence_pack_candidate

forbidden_scope:
  - external_send
  - source_outside_declared_perimeter
  - register_write
  - approval_of_any_kind

# Schema requires expected_outputs as a list of the output object types.
# The return status (draft_to_review) and evidence-pack requirement are
# enforced by the runner, not declared here.
expected_outputs:
  - result_candidate
  - evidence_pack_candidate

consequence_class: K3
approval_ceiling: C3

retrieval_boundary:
  store: pgvector
  boundary: retrieval_only

governance_refs:
  - docs/governance/MVP_GOVERNED_TASK_LOOP.md
  - docs/governance/TASK_CONTRACTS.md
  - docs/governance/USER_DECISION_GATE.md
  - docs/domain-packs/architecture/DOCUMENT_REVIEW.md
