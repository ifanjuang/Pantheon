[project]
name = "pantheon-mvp-vertical"
version = "0.2.0"
description = "Bounded executable candidate implementation co-located in the Pantheon Next monorepo; governance authority remains separate."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "PyYAML>=6.0",
  "psycopg[binary]>=3.1",
  # Runtime, not test-only: emitted payloads and Task Contracts are validated
  # against Pantheon Next's canonical schemas before use.
  "jsonschema>=4.22",
]

[project.optional-dependencies]
cockpit = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  # HttpPolicyClient consults the Pantheon PDP over HTTP at deploy time.
  "httpx>=0.27",
  # Provider-neutral OIDC/JWT verification; provider SDKs remain outside Pantheon.
  "PyJWT[crypto]>=2.13,<3",
  # Required only for the bounded multipart revision-upload surface.
  "python-multipart>=0.0.20,<1",
]
hermes = [
  # External one-shot observer and run clients. This extra does not install Hermes.
  "httpx>=0.27",
]
test = [
  "pytest>=8.0",
  "fastapi>=0.115",
  "httpx>=0.27",
  "PyJWT[crypto]>=2.13,<3",
  "python-multipart>=0.0.20,<1",
]

[project.scripts]
mvp-vertical = "mvp_vertical.cli:main"
mvp-cockpit-api = "mvp_vertical.cockpit_composed:run"
pantheon-hermes = "mvp_vertical.hermes_cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mvp_vertical"]

# setup.py stages the complete canonical schemas/ tree into this ignored
# directory before wheel/sdist creation. It is distribution material only.
[tool.setuptools.package-data]
mvp_vertical = [
  "_generated_contracts/**/*",
  "agency_schema/*.json",
  # Two lineages, so two patterns: sql/ holds the Agency and Cockpit sequence,
  # sql/hermes/ the Hermes one. A bare sql/*.sql silently drops the second.
  "sql/*.sql",
  "sql/hermes/*.sql",
  "mobile_editor/*",
  "cockpit/**/*",
]
