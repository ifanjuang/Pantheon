  - scenario_ids: [H54-IFC-COMPLETE-DISAPPEARANCE]
    title: Complete comparable IFC snapshot may show source disappearance without stable retirement
    expected_valid: true
    invariants: [candidate_authority, source_disappearance_not_retirement]
    overrides:
      observation_bundle_id: observation-bundle.h54.complete-disappearance
      task_contract_ref: task-contract.compare-ifc-complete.01
      basis:
        source_artifact_refs: [source.ifc.model-a]
        source_version_refs: [snapshot.ifc.010, snapshot.ifc.011]
        exact_digests:
          - {source_artifact_ref: source.ifc.model-a, source_version_ref: snapshot.ifc.010, digest: sha256:ifc-010}
          - {source_artifact_ref: source.ifc.model-a, source_version_ref: snapshot.ifc.011, digest: sha256:ifc-011}
      method:
        capability_id: building_model.compare.ifc_snapshots
        binding_id: binding.synthetic.ifc
        operation_id: ifc.compare.complete_snapshots.v1
        adapter_ref: pantheon.synthetic.ifc
        adapter_version: 1.0.0
        request_ref: request-h54-disappearance
      observed_at: "2026-08-09T17:32:00Z"
      freshness_token: sha256:ifc-011
      scope: {document_refs: [ifc-document:model-a], classes: [IfcDoor]}
      coverage:
        completeness: complete_for_declared_scope
        observed_scope: {document_refs: [ifc-document:model-a], classes: [IfcDoor]}
        excluded_reasons: []
        absence_inference_allowed: true
      limitations: [Source occurrence disappearance is not stable-object retirement.]
      source_representations:
        - representation_id: rep.ifc.010.door-removed-later
          project_ref: project-a
          source_artifact_ref: source.ifc.model-a
          source_version_ref: snapshot.ifc.010
          source_kind: ifc
          identifiers: [{scheme: ifc.global_id, value: 3aRemovedLater}]
          observed_at: "2026-08-08T12:00:00Z"
          binding_ref: binding.synthetic.ifc
          adapter_version: 1.0.0
          freshness_token: sha256:ifc-010
          proof_status: candidate
      attribute_claim_candidates: []
      relation_claim_candidates: []
      gaps: []
      withheld: []
      warnings:
        - code: source.occurrence_not_observed_in_later_complete_snapshot
          subject_refs: [rep.ifc.010.door-removed-later]
        - code: project.retirement_not_inferred
      operational_outcome: success

