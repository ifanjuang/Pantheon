corpus_id: h5.4.ifc-source-qualification
status: qualification_only
parent_issue: 618
base_example: observation_bundle.example.yaml
scenarios:
  - scenario_ids: [H54-IFC-SAME-GUID-CHANGED]
    title: Same IFC GlobalId across snapshots preserves changed source observations
    expected_valid: true
    invariants: [candidate_authority, same_guid_changed_state_preserved]
    overrides:
      observation_bundle_id: observation-bundle.h54.same-guid-changed
      task_contract_ref: task-contract.observe-ifc-snapshots.01
      basis:
        source_artifact_refs: [source.ifc.model-a]
        source_version_refs: [snapshot.ifc.001, snapshot.ifc.002]
        exact_digests:
          - {source_artifact_ref: source.ifc.model-a, source_version_ref: snapshot.ifc.001, digest: sha256:ifc-001}
          - {source_artifact_ref: source.ifc.model-a, source_version_ref: snapshot.ifc.002, digest: sha256:ifc-002}
      method:
        capability_id: building_model.observe.ifc
        binding_id: binding.synthetic.ifc
        operation_id: ifc.observe.snapshots.v1
        adapter_ref: pantheon.synthetic.ifc
        adapter_version: 1.0.0
        request_ref: request-h54-same-guid
      observed_at: "2026-08-09T17:30:00Z"
      freshness_token: sha256:ifc-snapshot-pair
      scope: {document_refs: [ifc-document:model-a], classes: [IfcDoor]}
      coverage:
        completeness: complete_for_declared_scope
        observed_scope: {document_refs: [ifc-document:model-a], classes: [IfcDoor]}
        excluded_reasons: []
        absence_inference_allowed: true
      limitations: [Same source identifier does not mean unchanged properties across snapshots.]
      source_representations:
        - representation_id: rep.ifc.001.door-guid-a
          project_ref: project-a
          source_artifact_ref: source.ifc.model-a
          source_version_ref: snapshot.ifc.001
          source_kind: ifc
          identifiers: [{scheme: ifc.global_id, value: 3aDoorGuidA}]
          locators: [{type: ifc_guid, value: 3aDoorGuidA}]
          observed_at: "2026-08-08T12:00:00Z"
          binding_ref: binding.synthetic.ifc
          adapter_version: 1.0.0
          freshness_token: sha256:ifc-001
          content_digest: sha256:door-guid-a-state-001
          proof_status: candidate
        - representation_id: rep.ifc.002.door-guid-a
          project_ref: project-a
          source_artifact_ref: source.ifc.model-a
          source_version_ref: snapshot.ifc.002
          source_kind: ifc
          identifiers: [{scheme: ifc.global_id, value: 3aDoorGuidA}]
          locators: [{type: ifc_guid, value: 3aDoorGuidA}]
          observed_at: "2026-08-09T12:00:00Z"
          binding_ref: binding.synthetic.ifc
          adapter_version: 1.0.0
          freshness_token: sha256:ifc-002
          content_digest: sha256:door-guid-a-state-002
          proof_status: candidate
      attribute_claim_candidates:
        - attribute_claim_id: claim.ifc.001.fire-rating
          subject_ref: {entity_type: source_representation, entity_id: rep.ifc.001.door-guid-a}
          attribute_key: ifc.pset_door_common.fire_rating
          value: {value_type: text, value: EI30}
          assertion_mode: observed
          source_authority: project_working_document
          proof_status: candidate
          source_representation_refs: [rep.ifc.001.door-guid-a]
        - attribute_claim_id: claim.ifc.002.fire-rating
          subject_ref: {entity_type: source_representation, entity_id: rep.ifc.002.door-guid-a}
          attribute_key: ifc.pset_door_common.fire_rating
          value: {value_type: text, value: EI60}
          assertion_mode: observed
          source_authority: project_working_document
          proof_status: candidate
          source_representation_refs: [rep.ifc.002.door-guid-a]
      relation_claim_candidates: []
      gaps: []
      withheld: []
      warnings: [{code: source.same_identifier_changed_state}]
      operational_outcome: success

