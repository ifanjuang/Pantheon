  - scenario_ids: [H53-DOC-REQ]
    title: CCTP prescription remains outside observational claims
    expected_valid: true
    invariants: [candidate_authority, requirement_not_observation]
    overrides:
      observation_bundle_id: observation-bundle.h53.cctp-requirement
      task_contract_ref: task-contract.observe-cctp.01
      basis:
        source_artifact_refs: [source.cctp.lot-menuiseries]
        source_version_refs: [document-revision:cctp-index-c]
        exact_digests:
          - source_artifact_ref: source.cctp.lot-menuiseries
            source_version_ref: document-revision:cctp-index-c
            digest: sha256:cctp-index-c
      method:
        capability_id: document.observe.structured_text
        binding_id: binding.synthetic.document
        operation_id: document.observe.sections.v1
        adapter_ref: pantheon.synthetic.document
        adapter_version: 1.0.0
        request_ref: request-h53-doc-req
      observed_at: "2026-08-09T14:00:00Z"
      freshness_token: sha256:cctp-index-c
      scope:
        document_refs: [document:cctp]
        pages: [42]
        region_refs: [section:menuiseries-exterieures]
      coverage:
        completeness: complete_for_declared_scope
        observed_scope:
          document_refs: [document:cctp]
          pages: [42]
          region_refs: [section:menuiseries-exterieures]
        excluded_reasons: []
        absence_inference_allowed: false
      limitations: [Prescriptive material follows the separate requirement path.]
      source_representations:
        - representation_id: rep.cctp.menuiseries.section
          project_ref: project-a
          source_artifact_ref: source.cctp.lot-menuiseries
          source_version_ref: document-revision:cctp-index-c
          source_kind: other
          identifiers: [{scheme: document.section, value: menuiseries-exterieures}]
          locators: [{type: other, value: section:menuiseries-exterieures, page: 42}]
          observed_at: "2026-08-09T14:00:00Z"
          binding_ref: binding.synthetic.document
          adapter_version: 1.0.0
          freshness_token: sha256:cctp-index-c
          content_digest: sha256:cctp-index-c
          context:
            document_ref: document:cctp
            page: 42
            native_context: {semantic_role: prescription}
          proof_status: candidate
      attribute_claim_candidates: []
      relation_claim_candidates: []
      gaps: []
      withheld:
        - code: requirement.separate_path
          subject_refs: [rep.cctp.menuiseries.section]
      warnings: []
      operational_outcome: withheld

