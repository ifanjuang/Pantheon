  - scenario_ids: [H53-PHOTO-DEFECT]
    title: Apparent visual defect is not contractual non-conformity
    expected_valid: true
    invariants: [candidate_authority, apparent_not_contractual, photo_field_not_absence]
    overrides:
      observation_bundle_id: observation-bundle.h53.photo-defect
      task_contract_ref: task-contract.observe-site-photo.01
      basis:
        source_artifact_refs: [source.photo.site-17]
        source_version_refs: [photo-receipt:17]
        exact_digests:
          - source_artifact_ref: source.photo.site-17
            source_version_ref: photo-receipt:17
            digest: sha256:site-photo-17
      method:
        capability_id: image.observe.site_condition
        binding_id: binding.synthetic.image
        operation_id: image.observe.region.v1
        adapter_ref: pantheon.synthetic.image
        adapter_version: 1.0.0
        request_ref: request-h53-photo-defect
      observed_at: "2026-08-01T09:15:00Z"
      freshness_token: sha256:site-photo-17
      scope:
        document_refs: [photo-set:site]
        region_refs: [region:roof-ridge-visible]
      coverage:
        completeness: partial_for_declared_scope
        observed_scope:
          document_refs: [photo-set:site]
          region_refs: [region:roof-ridge-visible]
        excluded_reasons: [hidden_faces_not_visible, concealed_fixings_not_visible]
        absence_inference_allowed: false
      limitations: [Only visible condition is represented.]
