  - scenario_ids: [H53-PHOTO-HISTORY]
    title: Before and after photographs preserve separate observations
    expected_valid: true
    invariants: [candidate_authority, photo_history_preserved]
    overrides:
      observation_bundle_id: observation-bundle.h53.photo-history
      task_contract_ref: task-contract.compare-site-photos.01
      basis:
        source_artifact_refs: [source.photo.before, source.photo.after]
        exact_digests:
          - {source_artifact_ref: source.photo.before, digest: sha256:photo-before}
          - {source_artifact_ref: source.photo.after, digest: sha256:photo-after}
      method:
        capability_id: image.observe.site_condition
        binding_id: binding.synthetic.image
        operation_id: image.compare.observations.v1
        adapter_ref: pantheon.synthetic.image
        adapter_version: 1.0.0
        request_ref: request-h53-photo-history
      observed_at: "2026-08-09T15:00:00Z"
      freshness_token: sha256:photo-history-set
      scope: {document_refs: [photo-set:repair-history], region_refs: [region:affected-area]}
      coverage:
        completeness: partial_for_declared_scope
        observed_scope: {document_refs: [photo-set:repair-history], region_refs: [region:affected-area]}
        excluded_reasons: [intermediate_period_not_continuously_observed]
        absence_inference_allowed: false
      limitations: [Discrete photographs do not prove continuous state.]
      source_representations:
        - representation_id: rep.photo.before
          project_ref: project-a
          source_artifact_ref: source.photo.before
          source_kind: photo
          identifiers: [{scheme: image.region, value: affected-area}]
          observed_at: "2026-08-01T09:15:00Z"
          binding_ref: binding.synthetic.image
          adapter_version: 1.0.0
          freshness_token: sha256:photo-before
          content_digest: sha256:photo-before-region
          proof_status: candidate
        - representation_id: rep.photo.after
          project_ref: project-a
          source_artifact_ref: source.photo.after
          source_kind: photo
          identifiers: [{scheme: image.region, value: affected-area}]
          observed_at: "2026-08-08T16:30:00Z"
          binding_ref: binding.synthetic.image
          adapter_version: 1.0.0
          freshness_token: sha256:photo-after
          content_digest: sha256:photo-after-region
          proof_status: candidate
      attribute_claim_candidates:
        - attribute_claim_id: claim.photo.before.apparent-condition
          subject_ref: {entity_type: source_representation, entity_id: rep.photo.before}
          attribute_key: physical.apparent_condition
          value: {value_type: controlled_label, value: apparent_defect}
          assertion_mode: derived
          source_authority: model_interpretation_candidate
          proof_status: candidate
          source_representation_refs: [rep.photo.before]
        - attribute_claim_id: claim.photo.after.apparent-condition
          subject_ref: {entity_type: source_representation, entity_id: rep.photo.after}
          attribute_key: physical.apparent_condition
          value: {value_type: controlled_label, value: no_visible_defect_in_observed_region}
          assertion_mode: derived
          source_authority: model_interpretation_candidate
          proof_status: candidate
          source_representation_refs: [rep.photo.after]
      relation_claim_candidates: []
      gaps: [{code: temporal.continuity_not_observed, subject_refs: [rep.photo.before, rep.photo.after]}]
      withheld: []
      warnings: [{code: review.no_reservation_inference}]
      operational_outcome: success

