          source_artifact_ref: source.photo.site-17
          source_version_ref: photo-receipt:17
          source_kind: photo
          identifiers: [{scheme: image.region, value: roof-ridge-visible}]
          locators: [{type: other, value: image:roof-ridge-visible}]
          observed_at: "2026-08-01T09:15:00Z"
          binding_ref: binding.synthetic.image
          adapter_version: 1.0.0
          freshness_token: sha256:site-photo-17
          content_digest: sha256:photo-region-roof-ridge
          coordinate_frame: PIXEL
          proof_status: candidate
      attribute_claim_candidates:
