# Synthetic qualification material only; no real IFC, DWG, PDF or JPG is parsed.
# Each entry describes the receipt an admitted specialist reader WOULD return.
# The tests check canonical APU envelopes, not visual or geometric accuracy.
corpus_id: h5.cross-format-context.v1
status: qualification_only
project_ref: project-synthetic-renovation
known_stable_object_ref: OBJ-OPENING-004
questions:
  - "Quelle largeur est documentée pour cette baie et dans quelles sources ?"
  - "La baie du séjour est-elle réellement terminée ?"
  - "Que faut-il coordonner en esquisse si le logement reste occupé ?"
context:
  extension:
    mission_phase: esq
    actual_state: proposed
  occupied_existing_building:
    mission_phase: det
    actual_state: works_in_progress
    occupancy: occupied
  priority_condition: maintain_access_and_water_during_works
sources:
  - id: ifc
    filename: Modele.ifc
    source_ref: source.ifc.synthetic-001
    version_ref: ifc:snapshot-07
    digest: "sha256:synthetic-ifc-07"
    source_kind: ifc
    identifier: {scheme: ifc.global_id, value: IFC_OPENING_001}
    locator: {type: ifc_guid, value: IFC_OPENING_001}
    coordinate_frame: MODEL_LOCAL
    completeness: partial_for_declared_scope
    exclusions: [linked_models_not_observed]
    claim:
      key: geometry.width
      value: {value_type: number, value: 2.10, unit: m}
      assertion_mode: observed
      source_authority: project_working_document
