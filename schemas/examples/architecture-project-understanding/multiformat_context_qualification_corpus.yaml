      - "IFC property is not evidence of fabrication, installation or approval."
  - id: dwg
    filename: Plan-RDC-ind-C.dwg
    source_ref: source.dwg.synthetic-002
    version_ref: drawing:index-c
    digest: "sha256:synthetic-dwg-c"
    source_kind: drawing
    identifier: {scheme: cad.entity_handle, value: "A01F"}
    locator: {type: drawing_sheet, value: "A-101 / modelspace: A01F"}
    coordinate_frame: MODEL_LOCAL
    completeness: partial_for_declared_scope
    exclusions: [external_references_not_resolved]
    claim:
      key: geometry.width
      value: {value_type: number, value: 2.10, unit: m}
      assertion_mode: derived
      source_authority: model_interpretation_candidate
    limitations:
      - "Drawing geometry has unknown unit calibration and unresolved XREFs."
