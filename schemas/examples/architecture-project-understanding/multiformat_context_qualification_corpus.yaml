  - id: pdf
    filename: Plan-RDC-ind-B.pdf
    source_ref: source.pdf.synthetic-003
    version_ref: drawing:index-b
    digest: "sha256:synthetic-pdf-b"
    source_kind: drawing
    identifier: {scheme: drawing.local_label, value: BAIE-S01}
    locator: {type: page_bbox, value: "page1:120,210,240,330", page: 1, bbox: [120, 210, 240, 330]}
