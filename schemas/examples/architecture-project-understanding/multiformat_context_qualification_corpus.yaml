acceptance:
  candidate_only: true
  source_native_identifiers_are_not_stable_object_id: true
  common_project_is_not_automatic_identity_match: true
  mixed_phase_must_be_preserved: true
  occupied_site_priorities_may_override_esq_default: true
  no_winner_from_recency_or_agreement: true
  never_conclude_absence_from_partial_coverage: true
  never_derive_metric_dimensions_from_uncalibrated_jpg: true
  dwg_without_xrefs_or_units_is_not_complete: true
  visual_observation_not_execution_or_reception: true
  hindsight_memory_is_not_evidence: true
  no_automatic_retain_or_apu_write: true
