      - "Width is explicitly dimensioned in a synthetic plan, not measured from uncalibrated pixels."
  - id: jpg
    filename: Photo-chantier.jpg
    source_ref: source.jpg.synthetic-004
    version_ref: photo:2026-10-01-01
    digest: "sha256:synthetic-jpg-01"
    source_kind: photo
    identifier: {scheme: image.region, value: opening-left-half}
    locator: {type: other, value: "image region: opening-left-half"}
    coordinate_frame: PIXEL
    completeness: partial_for_declared_scope
    exclusions: [hidden_elements_not_visible, no_metric_calibration]
    claim:
      key: physical.apparent_condition
      value: {value_type: text, value: opening_apparently_unfinished}
      assertion_mode: derived
      source_authority: model_interpretation_candidate
    limitations:
