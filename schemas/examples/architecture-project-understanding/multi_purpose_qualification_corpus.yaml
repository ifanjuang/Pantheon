      assertion_mode: human_asserted
      source_authority: project_working_document
      proof_status: accepted_as_support
      source_representation_refs: [rep.photo.hvac-004]

  attribute_claims:
    - attribute_claim_id: claim.pdf.opening-width
      subject_ref: {entity_type: source_representation, entity_id: rep.pdf.opening-017}
      attribute_key: geometry.width
      value: {value_type: number, value: 0.90, unit: m}
      assertion_mode: observed
      source_authority: project_working_document
      proof_status: accepted_as_support
      source_representation_refs: [rep.pdf.opening-017]
    - attribute_claim_id: claim.ifc.opening-width
      subject_ref: {entity_type: source_representation, entity_id: rep.ifc.opening-017}
      attribute_key: geometry.width
      value: {value_type: number, value: 0.93, unit: m}
      assertion_mode: observed
      source_authority: model_interpretation_candidate
      proof_status: candidate
      source_representation_refs: [rep.ifc.opening-017]
    - attribute_claim_id: claim.revit.opening-width
      subject_ref: {entity_type: source_representation, entity_id: rep.revit.opening-017}
      attribute_key: geometry.width
      value: {value_type: number, value: 0.93, unit: m}
      assertion_mode: observed
      source_authority: project_working_document
      proof_status: candidate
      source_representation_refs: [rep.revit.opening-017]
    - attribute_claim_id: claim.ifc.opening-count
      subject_ref: {entity_type: source_representation, entity_id: rep.ifc.opening-017}
      attribute_key: economy.observed_count
      value: {value_type: number, value: 1}
      assertion_mode: derived
      source_authority: model_interpretation_candidate
      proof_status: candidate
      source_representation_refs: [rep.ifc.opening-017]
    - attribute_claim_id: claim.dpgf.opening-count
      subject_ref: {entity_type: source_representation, entity_id: rep.dpgf.openings}
      attribute_key: economy.document_quantity
      value: {value_type: number, value: 2}
      assertion_mode: observed
      source_authority: project_working_document
      proof_status: candidate
      source_representation_refs: [rep.dpgf.openings]
      notes: Document quantity is not an adopted or payable quantity.
    - attribute_claim_id: claim.revit.opening-uw
      subject_ref: {entity_type: source_representation, entity_id: rep.revit.opening-017}
      attribute_key: thermal.uw
      value: {value_type: number, value: 1.4, unit: W/m2K}
      assertion_mode: observed
      source_authority: project_working_document
      proof_status: candidate
      source_representation_refs: [rep.revit.opening-017]
    - attribute_claim_id: claim.ifc.opening-material
      subject_ref: {entity_type: source_representation, entity_id: rep.ifc.opening-017}
      attribute_key: material.product_candidate
      value: {value_type: controlled_label, value: aluminium_window_candidate_a}
      assertion_mode: derived
      source_authority: model_interpretation_candidate
      proof_status: candidate
      source_representation_refs: [rep.ifc.opening-017]
    - attribute_claim_id: claim.revit.opening-fdes
      subject_ref: {entity_type: source_representation, entity_id: rep.revit.opening-017}
      attribute_key: carbon.fdes_candidate
      value: {value_type: reference, value: fdes:candidate-b}
      assertion_mode: derived
      source_authority: model_interpretation_candidate
      proof_status: candidate
      source_representation_refs: [rep.revit.opening-017]
      notes: Reference availability does not establish applicability.
    - attribute_claim_id: claim.photo.hvac-installed
      subject_ref: {entity_type: source_representation, entity_id: rep.photo.hvac-004}
      attribute_key: physical.installation_status
      value: {value_type: controlled_label, value: apparently_installed}
      assertion_mode: observed
      source_authority: model_interpretation_candidate
      proof_status: accepted_as_support
      source_representation_refs: [rep.photo.hvac-004]
    - attribute_claim_id: claim.cctp.swale-capacity-group
      subject_ref: {entity_type: source_representation, entity_id: rep.cctp.swale-group}
      attribute_key: stormwater.required_capacity_group
      value: {value_type: number, value: 75, unit: L/m2}
      assertion_mode: observed
      source_authority: project_working_document
      proof_status: candidate
      source_representation_refs: [rep.cctp.swale-group]
      notes: Source-level group statement is not duplicated onto every landscape object.

# Existing document-currentness semantics are represented here only as the output
# of their own owner/projection. These postures are not generalized into a
# Project Anatomy purpose status.
document_currentness_examples:
  - document_ref: document:dpgf-menuiseries
    purpose: latest_received
    posture: resolved
    version_ref: revision:C
    basis_refs: [receipt:C]
  - document_ref: document:dpgf-menuiseries
    purpose: current_for_coordination
    posture: resolved
    version_ref: revision:B
    basis_refs: [version-event:B:coordination]
  - document_ref: document:dpgf-menuiseries
    purpose: current_contractual
    posture: unresolved
    missing_requirements: [contractual_authority_basis]

purpose_cases:
  - purpose_id: architecture_design
    stable_object_refs: [OBJ-OPENING-017, OBJ-SWALE-001]
    basis_claim_refs:
      - claim.pdf.opening-width
      - claim.ifc.opening-width
      - claim.revit.opening-width
      - claim.cctp.swale-capacity-group
    conflict_sets:
      - [claim.pdf.opening-width, claim.ifc.opening-width, claim.revit.opening-width]
    missing_inputs: []
    external_refs: []
    prohibited_inferences: [accepted_design, universal_current_value]

  - purpose_id: economy_quantities
    stable_object_refs: [OBJ-OPENING-017, OBJ-SWALE-001]
    basis_claim_refs:
      - claim.ifc.opening-count
      - claim.dpgf.opening-count
      - claim.cctp.swale-capacity-group
    conflict_sets:
      - [claim.ifc.opening-count, claim.dpgf.opening-count]
    missing_inputs: [adopted_dpgf_quantity, payable_quantity]
    external_refs:
      - document-currentness:document:dpgf-menuiseries:latest_received
      - document-currentness:document:dpgf-menuiseries:current_contractual
    prohibited_inferences: [payable_quantity, approved_budget, contractual_currentness_from_latest_received]

  - purpose_id: construction_det
    stable_object_refs: [OBJ-HVAC-004, OBJ-OPENING-017]
    basis_claim_refs: [claim.photo.hvac-installed]
    conflict_sets: []
    missing_inputs: [commissioning_test, attestation, reception_decision]
    external_refs: [work-issue:hvac-verification]
    prohibited_inferences: [verified, compliant, received, reservation_free]

  - purpose_id: thermal_re2020_preparation
    stable_object_refs: [OBJ-OPENING-017]
    basis_claim_refs:
      - claim.pdf.opening-width
      - claim.revit.opening-uw
    conflict_sets:
      - [claim.pdf.opening-width, claim.ifc.opening-width, claim.revit.opening-width]
    missing_inputs: [validated_orientation, validated_frame_fraction]
    external_refs: [execution-result:thermal-calculation-candidate]
    prohibited_inferences: [validated_input, regulatory_compliance]

  - purpose_id: acv_carbon_preparation
    stable_object_refs: [OBJ-OPENING-017, OBJ-SWALE-001]
    basis_claim_refs:
      - claim.ifc.opening-material
      - claim.revit.opening-fdes
      - claim.ifc.opening-count
    conflict_sets: []
    missing_inputs: [fdes_applicability_review, accepted_acv_quantity]
    external_refs: [execution-result:acv-calculation-candidate]
    prohibited_inferences: [specified_product, fdes_applicable, acv_approved]

authority:
  is_project_truth_projection: false
  is_evidence: false
  is_decision: false
  is_approval: false
  is_payment_state: false
  is_reception_state: false
  is_regulatory_compliance: false
  authorizes_external_effect: false
