corpus_id: h5.7.project-anatomy.multi-purpose
status: qualification_only
parent_issue: 624
description: >-
  One shared Project Anatomy world reused across architecture, economy/quantities,
  construction/DET, thermal/RE2020 preparation and ACV/carbon preparation. The
  purpose_cases section is fixture-only qualification metadata; it is not a
  persisted status model, a purpose owner or a professional sufficiency contract.

