      subject_ref: {entity_type: source_representation, entity_id: rep.pdf.opening-017}
      relation_type: identity.represents
      object_ref: {entity_type: stable_object, entity_id: OBJ-OPENING-017}
      assertion_mode: human_asserted
      source_authority: project_working_document
      proof_status: accepted_as_support
      source_representation_refs: [rep.pdf.opening-017]
    - relation_claim_id: identity.ifc.opening-017
      subject_ref: {entity_type: source_representation, entity_id: rep.ifc.opening-017}
      relation_type: identity.represents
      object_ref: {entity_type: stable_object, entity_id: OBJ-OPENING-017}
      assertion_mode: human_asserted
      source_authority: project_working_document
      proof_status: accepted_as_support
      source_representation_refs: [rep.ifc.opening-017]
    - relation_claim_id: identity.revit.opening-017
      subject_ref: {entity_type: source_representation, entity_id: rep.revit.opening-017}
      relation_type: identity.represents
      object_ref: {entity_type: stable_object, entity_id: OBJ-OPENING-017}
