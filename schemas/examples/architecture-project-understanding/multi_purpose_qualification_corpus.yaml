  project_ref: project-h57
  stable_objects:
    - stable_object_id: OBJ-OPENING-017
      project_ref: project-h57
      object_family: element
      nomenclature:
        internal_code: P17
        display_name: Baie séjour
    - stable_object_id: OBJ-HVAC-004
