contract_id: example.task-contract
title: Example governed schema reconciliation task
intent: Reconcile governance schemas without adding runtime behavior.
scope:
  scope_type: repository
  scope_id: pantheon-next
  scope_label: Pantheon Next repository
  included:
    - schemas/
    - docs/governance/STATUS.md
    - CHANGELOG.md
  excluded:
    - operations/
    - tests/
    - platform/
    - Docker
    - .env
    - pyproject.toml
    - CLAUDE.md
  authority_limits:
    - validation structure only
    - no runtime semantics
    - no automatic approval
  expected_domain: governance
owner_role: HEPHAISTOS
role_viewpoints:
  - ATHENA
  - THEMIS
  - APOLLO
  - HEPHAISTOS
constraints:
  - Preserve OpenWebUI exposes, Hermes Agent executes, Pantheon Next governs.
  - Do not add execution, scheduling, provider routing or memory promotion semantics.
  - Keep schemas as validation contracts only.
approval_level: C3
requested_by: human-owner
created_at: "2026-05-17T20:00:00Z"
reasoning_topology:
  selected: fanout_extract_then_single_synthesis
  reason: Schema files and examples may be reviewed separately, but final schema meaning must remain consolidated under governance.
  handoff_policy: evidence_items_only
  evidence_policy: source_linked_evidence_items_required
  synthesis_policy: single consolidated review before treating schema changes as stable
  memory_policy: no memory promotion from schema examples
  approval_policy: protected schema area requires explicit human authorization
  rejected_topologies:
    - bounded_hermes_swarm_as_authority
    - summary_only_handoff
  topology_risks:
    - schema fields may be misread as runtime dispatch
    - examples may be mistaken for executable configuration
  forbidden_handoffs:
    - recommendation_without_source_locator
    - handoff_as_approval
expected_evidence:
  - updated schema files
  - updated examples
  - changelog entry
  - ai_log entry
allowed_outputs:
  - schema updates
  - fictional examples
  - documentation status update
  - ai_log entry
forbidden_outputs:
  - runtime execution
  - provider routing
  - scheduler or queue semantics
  - automatic memory promotion
  - hidden workflow runtime
memory_rules:
  memory_behavior: no_memory_output
  promotion_allowed: false
  notes: This task does not create Canonical Memory.
risk_notes:
  - Schema fields may be misread as runtime semantics.
  - Examples must remain fictional and non-executable.
protected_areas:
  - schemas/
evidence_required: true
governance_refs:
  - docs/governance/TASK_CONTRACTS.md
  - docs/governance/APPROVALS.md
  - docs/governance/HERMES_INTEGRATION.md
  - docs/governance/SCOPE_ISOLATION.md
  - docs/governance/EVIDENCE_PACK.md
  - docs/governance/EVIDENCE_TOPOLOGY.md
