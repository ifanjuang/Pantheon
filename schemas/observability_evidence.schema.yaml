$schema: "https://json-schema.org/draft/2020-12/schema"
title: Pantheon Next Observability Evidence
description: >-
  Input contract for the read-only verify_observability policy tool. It is
  evidence already gathered elsewhere about whether a component can be observed —
  its signal inventory (logs / metrics / traces present), data freshness and
  error level — provided to the tool, never fetched by it. The tool classifies
  this evidence into a verdict as data (observable / degraded / blind / unknown)
  and reports capability gaps when evidence is insufficient. It performs no
  probe, no NAS access, no metrics query and decides nothing. Every field is
  optional and missing signals become capability gaps, but any field that is
  present is validated strictly before classification; malformed evidence
  returns an error and no positive verdict.
type: object
properties:
  component:
    type: string
    description: Name of the component whose observability is being verified.
  signals:
    type: array
    description: >-
      Provided signal inventory. With an inventory present but nothing
      `present`, the component is blind; an expected signal absent makes it
      degraded.
    items:
      type: object
      required:
        - name
        - present
      properties:
        name:
          type: string
        present:
          type: boolean
        detail:
          type: string
      additionalProperties: false
  expected_signals:
    type: array
    items:
      type: string
    description: >-
      Signals that must all be present for the verdict to be observable. If
      omitted, every signal named in `signals` is treated as expected.
  freshness:
    type: object
    description: Provided data freshness. The tool queries no backend itself.
    properties:
      last_event_age_s:
        type: number
      max_age_s:
        type: number
    additionalProperties: false
  errors:
    type: object
    description: Provided error level. Fresh signals with errors over threshold are degraded.
    properties:
      count:
        type: number
      threshold:
        type: number
    additionalProperties: false
required: []
additionalProperties: false
governance_refs:
  - docs/governance/PANTHEON_MCP_POLICY_SERVER_DEVELOPMENT.md
  - docs/governance/PANTHEON_CONTROL_BOUNDARY.md
x-boundary:
  runtime_execution: false
  decision_is_data: true
  performs_probe: false
  nas_access: false
  metrics_query: false
  autonomous_loop: false
  provider_routing: false
  scheduler: false
  queue_system: false
  memory_promotion: false
  automatic_canonization: false
