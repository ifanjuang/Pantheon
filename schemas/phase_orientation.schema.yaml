$schema: "https://json-schema.org/draft/2020-12/schema"
$id: https://pantheon.local/schemas/phase_orientation.schema.yaml
title: Architecture Phase Orientation Registry
description: >-
  Specialized registry schema for the phase orientation of the architecture
  agency domain pack: per phase block, the candidate deliverables, the minimum
  evidence and the gate of the domain pack phase map, and the gate risk of the
  index effect matrix, written in French. An entry orients a reader on the main
  subjects of a phase. It is not a checklist: it computes no status, checks no
  completeness and reports no missing item, and a listed deliverable is not
  required. Phase codes are declared by architecture_phase_profile; this
  registry declares none.
$ref: "#/$defs/registry"
$defs:
  phase_id:
    type: string
    pattern: "^[A-Z][A-Z0-9_]{1,39}$"
  text:
    type: string
    minLength: 1
    maxLength: 240
  text_list:
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/text"
  entry:
    type: object
    additionalProperties: false
    required: [id, phases, source_section, label, deliverables, minimum_evidence, gate, gate_risks]
    properties:
      id:
        type: string
        pattern: "^[A-Z][A-Z0-9_]{1,39}$"
      phases:
        description: Phase codes this block covers, each declared by architecture_phase_profile.
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: "#/$defs/phase_id"
      source_section:
        description: Heading of the block in the domain pack phase map, verbatim.
        type: string
        minLength: 1
      label:
        $ref: "#/$defs/text"
      deliverables:
        $ref: "#/$defs/text_list"
      minimum_evidence:
        $ref: "#/$defs/text_list"
      gate:
        $ref: "#/$defs/text"
      gate_risks:
        description: Gate risk of the index effect matrix, by phase code of this block.
        type: object
        propertyNames:
          $ref: "#/$defs/phase_id"
        additionalProperties:
          $ref: "#/$defs/text"
      note:
        type: string
        minLength: 1
        maxLength: 600
  registry:
    type: object
    additionalProperties: false
    required:
      - schema_version
      - registry_id
      - registry_kind
      - version
      - status
      - owner
      - authority_document
      - governance_refs
      - description
      - profile
      - entries
      - x_boundary
    properties:
      schema_version:
        const: "1"
      registry_id:
        const: architecture_phase_orientation
      registry_kind:
        const: vocabulary
      version:
        type: string
        pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
      status:
        type: string
        enum: [candidate, active, under_review, deprecated, superseded]
      owner:
        type: object
        additionalProperties: false
        required: [id, repository]
        properties:
          id:
            type: string
            minLength: 1
          repository:
            type: string
            enum: [Pantheon-Next]
      authority_document:
        type: string
        pattern: "^(docs|registries|schemas)/.+"
      governance_refs:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          pattern: "^(docs|registries|schemas)/.+"
      description:
        type: string
        minLength: 1
      profile:
        type: object
        additionalProperties: false
        required: [id, language, phase_registry, sources]
        properties:
          id:
            type: string
            pattern: "^[a-z][a-z0-9_]*@[0-9]+$"
          language:
            const: fr
          phase_registry:
            const: architecture_phase_profile
          sources:
            type: object
            additionalProperties: false
            required: [blocks, gate_risks]
            properties:
              blocks:
                type: string
                pattern: "^docs/.+"
              gate_risks:
                type: string
                pattern: "^docs/.+"
      entries:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/entry"
      x_boundary:
        type: object
        additionalProperties: false
        required:
          - runtime_execution
          - provider_routing
          - task_authorization
          - approval
          - evidence_promotion
          - memory_promotion
          - completeness_check
          - status_computation
        properties:
          runtime_execution: { const: false }
          provider_routing: { const: false }
          task_authorization: { const: false }
          approval: { const: false }
          evidence_promotion: { const: false }
          memory_promotion: { const: false }
          completeness_check: { const: false }
          status_computation: { const: false }
