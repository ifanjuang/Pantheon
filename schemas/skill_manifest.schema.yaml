$schema: "https://json-schema.org/draft/2020-12/schema"
title: Pantheon Next Skill Manifest
description: Governance schema for declaring a watched skill, candidate skill or capability pack without installing or executing it.
type: object
required:
  - skill_id
  - title
  - purpose
  - owner_role
  - lifecycle_state
  - installation_state
  - required_approvals
  - risk_level
  - allowed_use
  - forbidden_use
  - evidence_expectation
properties:
  skill_id:
    type: string
    pattern: "^[a-z0-9._-]+$"
  title:
    type: string
    minLength: 3
  purpose:
    type: string
    minLength: 10
  owner_role:
    type: string
    enum:
      - ATHENA
      - ARGOS
      - THEMIS
      - APOLLO
      - ZEUS
      - IRIS
      - HEPHAISTOS
      - MNEMOSYNE
  lifecycle_state:
    type: string
    enum:
      - watch
      - pattern_candidate
      - hermes_candidate
      - distill_into_doctrine
      - distill_into_hermes_candidate
      - reject_runtime_drift
      - reject_memory_drift
      - reject_external_effect_risk
      - quarantined
      - rejected
      - archived
  installation_state:
    type: string
    enum:
      - not_installed
      - external_reference_only
      - candidate_template_only
      - installed_outside_pantheon
  required_approvals:
    type: array
    minItems: 1
    items:
      type: string
      enum:
        - C0
        - C1
        - C2
        - C3
        - C4
        - C5
  risk_level:
    type: string
    enum:
      - low
      - medium
      - high
      - critical
  allowed_use:
    type: array
    minItems: 1
    items:
      type: string
  forbidden_use:
    type: array
    minItems: 1
    items:
      type: string
  evidence_expectation:
    type: array
    minItems: 1
    items:
      type: string
  external_dependencies:
    type: array
    items:
      type: string
  evidence_pack_id:
    type:
      - string
      - "null"
  approval_notes:
    type: string
  memory_implication:
    type: string
    enum:
      - none
      - may_propose_memory_candidate
      - memory_drift_risk
      - memory_forbidden
  governance_refs:
    type: array
    items:
      type: string
    default:
      - docs/governance/SKILL_WATCHLIST.md
      - docs/governance/HERMES_INTEGRATION.md
      - docs/governance/EXTERNAL_TOOLS_POLICY.md
      - docs/governance/EVIDENCE_PACK.md
additionalProperties: false
x-boundary:
  runtime_execution: false
  autonomous_loop: false
  provider_routing: false
  scheduler: false
  queue_system: false
  plugin_manager: false
  skill_marketplace: false
  automatic_installation: false
  tool_runtime: false
  memory_promotion: false
