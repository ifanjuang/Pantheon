$schema: "https://json-schema.org/draft/2020-12/schema"
title: Architecture Project Understanding Observation Bundle Candidate
description: >-
  Candidate-only exchange envelope returned by an admitted source adapter. It
  carries bounded source observations, their actual coverage and operational
  limitations without creating Project Anatomy truth, Evidence, a decision, a
  memory item, an APU write or an authorization. Scope states what was requested;
  coverage states what the adapter actually observed.
type: object
additionalProperties: false
required:
  - observation_bundle_id
  - project_ref
  - task_contract_ref
  - basis
  - method
  - observed_at
  - scope
  - coverage
  - limitations
  - source_representations
  - attribute_claim_candidates
  - relation_claim_candidates
  - gaps
  - withheld
  - warnings
  - operational_outcome
  - authority
properties:
  observation_bundle_id: { type: string, minLength: 1 }
  project_ref: { type: string, minLength: 1 }
  task_contract_ref: { type: string, minLength: 1 }
  basis:
    type: object
    additionalProperties: false
    required: [source_artifact_refs]
    properties:
      source_artifact_refs:
        type: array
        minItems: 1
        uniqueItems: true
        items: { type: string, minLength: 1 }
      source_version_refs:
        type: array
        uniqueItems: true
        items: { type: string, minLength: 1 }
      exact_digests:
        type: array
        uniqueItems: true
        items:
          type: object
          additionalProperties: false
          required: [source_artifact_ref, digest]
          properties:
            source_artifact_ref: { type: string, minLength: 1 }
            source_version_ref: { type: string, minLength: 1 }
            digest: { type: string, minLength: 1 }
      revision_set_ref: { type: string, minLength: 1 }
  method:
    type: object
    additionalProperties: false
    required:
      - capability_id
      - binding_id
      - adapter_ref
      - adapter_version
      - request_ref
    properties:
      capability_id: { type: string, minLength: 1 }
      binding_id: { type: string, minLength: 1 }
      operation_id: { type: string, minLength: 1 }
      adapter_ref: { type: string, minLength: 1 }
      adapter_version: { type: string, minLength: 1 }
      runtime_ref: { type: string, minLength: 1 }
      runtime_version: { type: string, minLength: 1 }
      request_ref: { type: string, minLength: 1 }
      run_ref: { type: string, minLength: 1 }
  observed_at:
    $ref: "shared.schema.yaml#/$defs/date_time"
  freshness_token:
    description: >-
      Source-snapshot freshness only. For Revit this is document_freshness;
      view_freshness and selection_freshness remain execution preconditions and
      are never additional Project Anatomy primitives.
    type: string
    minLength: 1
  scope:
    $ref: "#/$defs/bounded_scope"
  coverage:
    type: object
    additionalProperties: false
    required:
      - completeness
      - observed_scope
      - excluded_reasons
      - absence_inference_allowed
    properties:
      completeness:
        type: string
        enum:
          - complete_for_declared_scope
          - partial_for_declared_scope
          - unknown
      observed_scope:
        $ref: "#/$defs/bounded_scope"
      excluded_reasons:
        type: array
        uniqueItems: true
        items: { type: string, minLength: 1 }
      absence_inference_allowed:
        type: boolean
  limitations:
    type: array
    uniqueItems: true
    items: { type: string, minLength: 1 }
  source_representations:
    type: array
    items:
      allOf:
        - $ref: "source_representation.schema.yaml"
        - type: object
          properties:
            proof_status: { const: candidate }
          required: [proof_status]
  attribute_claim_candidates:
    type: array
    items:
      allOf:
        - $ref: "attribute_claim.schema.yaml"
        - type: object
          properties:
            proof_status: { const: candidate }
          required: [proof_status]
  relation_claim_candidates:
    type: array
    items:
      allOf:
        - $ref: "relation_claim.schema.yaml"
        - type: object
          properties:
            proof_status: { const: candidate }
          required: [proof_status]
  gaps:
    type: array
    items: { $ref: "#/$defs/operational_item" }
  withheld:
    type: array
    items: { $ref: "#/$defs/operational_item" }
  warnings:
    type: array
    items: { $ref: "#/$defs/operational_item" }
  operational_outcome:
    type: string
    enum: [success, withheld, blocked, refused, failed, cancelled, rolled_back]
  authority:
    type: object
    additionalProperties: false
    required:
      - is_fact
      - is_evidence
      - is_decision
      - is_memory
      - is_apu_write
      - authorizes_external_effect
    properties:
      is_fact: { const: false }
      is_evidence: { const: false }
      is_decision: { const: false }
      is_memory: { const: false }
      is_apu_write: { const: false }
      authorizes_external_effect: { const: false }
  governance_refs:
    type: array
    items: { type: string }
    default:
      - docs/domain-packs/architecture/PROJECT_UNDERSTANDING_ADAPTER_CONTRACT.md
      - docs/domain-packs/architecture/PROJECT_ANATOMY_MODEL.md
      - revit-plugin/docs/FRESHNESS_SCOPES.md
      - schemas/architecture-project-understanding/shared.schema.yaml
      - schemas/architecture-project-understanding/source_representation.schema.yaml
      - schemas/architecture-project-understanding/attribute_claim.schema.yaml
      - schemas/architecture-project-understanding/relation_claim.schema.yaml
allOf:
  - if:
      properties:
        operational_outcome:
          enum: [success, withheld]
      required: [operational_outcome]
    then:
      required: [freshness_token]
  - if:
      properties:
        coverage:
          type: object
          properties:
            completeness:
              enum: [partial_for_declared_scope, unknown]
          required: [completeness]
      required: [coverage]
    then:
      properties:
        coverage:
          properties:
            absence_inference_allowed: { const: false }
  - if:
      properties:
        operational_outcome:
          enum: [withheld, blocked, refused, failed, cancelled, rolled_back]
      required: [operational_outcome]
    then:
      properties:
        coverage:
          properties:
            absence_inference_allowed: { const: false }
$defs:
  bounded_scope:
    type: object
    additionalProperties: false
    minProperties: 1
    properties:
      document_refs: { $ref: "#/$defs/string_ref_array" }
      source_snapshot_refs: { $ref: "#/$defs/string_ref_array" }
      level_refs: { $ref: "#/$defs/string_ref_array" }
      zone_refs: { $ref: "#/$defs/string_ref_array" }
      categories: { $ref: "#/$defs/string_ref_array" }
      classes: { $ref: "#/$defs/string_ref_array" }
      phase_refs: { $ref: "#/$defs/string_ref_array" }
      sheet_refs: { $ref: "#/$defs/string_ref_array" }
      pages:
        type: array
        uniqueItems: true
        items: { type: integer, minimum: 1 }
      region_refs: { $ref: "#/$defs/string_ref_array" }
      view_refs: { $ref: "#/$defs/string_ref_array" }
      property_groups: { $ref: "#/$defs/string_ref_array" }
      measurement_modes: { $ref: "#/$defs/string_ref_array" }
      include_linked_sources: { type: boolean }
      linked_source_refs: { $ref: "#/$defs/string_ref_array" }
  string_ref_array:
    type: array
    uniqueItems: true
    items: { type: string, minLength: 1 }
  operational_item:
    type: object
    additionalProperties: false
    required: [code]
    properties:
      code:
        type: string
        minLength: 3
        pattern: "^[a-z][a-z0-9_.-]*$"
      message: { type: string, minLength: 1 }
      subject_refs: { $ref: "#/$defs/string_ref_array" }
x-boundary:
  runtime_execution: false
  provider_routing: false
  memory_promotion: false
  automatic_apu_write: false
  automatic_canonization: false
  evidence_admission: false
  approval_engine: false
