$schema: "https://json-schema.org/draft/2020-12/schema"
title: Architecture Project Understanding Write Command Candidate
description: >-
  Immutable preparation of one bounded APU write from a reviewed candidate. It is
  not executable and does not itself confirm identity, mutate APU, admit Evidence
  or authorize an external effect. Target revisions freeze the freshness posture
  observed at preparation time; application must refuse stale revisions.
  add_match_to_existing_object carries the exact candidate source representation
  and identity relation. add_claim and supersede_claim carry one exact candidate
  attribute or relation claim from a reviewed Observation Bundle; supersede_claim
  also names the one claim it replaces. Every applied claim stays candidate.
  add_object carries the new stable object, its exact candidate source
  representation and the candidate identity relation between them; the object
  has no revision before it exists. retire_object names one existing object at
  a known revision and the reviewed reason; a retired object is kept, never
  erased, and its claims stay as history.
type: object
additionalProperties: false
required:
  - command_id
  - operation
  - project_ref
  - source_execution_result_ref
  - source_mapping_result_ref
  - source_mapping_ref
  - source_review_ref
  - expected_owner_revision
  - payload_digest
  - authority
properties:
  command_id: { type: string, minLength: 1 }
  operation:
    type: string
    enum: [add_match_to_existing_object, add_claim, supersede_claim, add_object, retire_object]
  project_ref: { type: string, minLength: 1 }
  source_execution_result_ref: { type: string, minLength: 1 }
  source_mapping_result_ref: { type: string, minLength: 1 }
  source_mapping_ref: { type: string, minLength: 1 }
  source_review_ref: { type: string, minLength: 1 }
  source_representation:
    description: >-
      Exact source occurrence selected for the bounded effect. Its candidate
      posture records source reality without establishing stable identity.
    allOf:
      - $ref: "source_representation.schema.yaml"
      - properties:
          proof_status: { const: candidate }
        required: [proof_status]
  identity_relation_claim:
    description: >-
      Exact identity-alignment claim proposed by the reviewed mapping. The
      application remains candidate-only and does not professionally validate it.
    allOf:
      - $ref: "relation_claim.schema.yaml"
      - properties:
          relation_type: { const: identity.represents }
          assertion_mode: { const: proposed }
          source_authority: { const: model_interpretation_candidate }
          proof_status: { const: candidate }
        required:
          - relation_type
          - assertion_mode
          - source_authority
          - proof_status
  stable_object:
    description: The new stable object an add_object command creates, copied from the reviewed candidate.
    $ref: "stable_object.schema.yaml"
  retirement:
    description: >-
      The reviewed retirement of one existing object. Absence from a newer source
      is a reason to propose it, never a proof: the review decides.
    type: object
    additionalProperties: false
    required: [stable_object_ref, reason]
    properties:
      stable_object_ref: { type: string, minLength: 1 }
      reason: { type: string, minLength: 3 }
      evidence_refs:
        type: array
        uniqueItems: true
        items: { type: string, minLength: 1 }
  certainty: { $ref: "shared.schema.yaml#/$defs/certainty" }
  match_axis: { $ref: "shared.schema.yaml#/$defs/match_axis" }
  expected_owner_revision:
    type: integer
    minimum: 1
    description: Project-scoped APU owner revision observed when the command was prepared.
  expected_object_revision:
    type: integer
    minimum: 1
    description: Target stable-object revision observed when the command was prepared.
  claim_family:
    type: string
    enum: [attribute, relation]
  claim:
    description: >-
      Exact candidate claim selected by the review, copied unchanged from the
      reviewed Observation Bundle. Identity relations (identity.*) are not claim
      writes: alignment stays with add_match_to_existing_object and the identity
      lifecycle (merge, split, supersession of objects) is not opened here.
    oneOf:
      - allOf:
          - $ref: "attribute_claim.schema.yaml"
          - properties:
              proof_status: { const: candidate }
            required: [proof_status]
      - allOf:
          - $ref: "relation_claim.schema.yaml"
          - properties:
              proof_status: { const: candidate }
              relation_type: { not: { pattern: "^identity\\." } }
            required: [proof_status, relation_type]
  superseded_claim_ref:
    description: >-
      The one claim of the same family, subject and attribute key (or relation
      type) that this claim replaces. The replaced claim is kept, never edited.
    type: string
    minLength: 1
  rationale: { type: string, minLength: 3 }
  payload_digest: { type: string, pattern: "^[a-f0-9]{64}$" }
  prepared_by: { type: string, minLength: 1 }
  prepared_at: { type: string, format: date-time }
  limitations:
    type: array
    uniqueItems: true
    items: { type: string, minLength: 1 }
  authority:
    type: object
    additionalProperties: false
    required:
      - is_fact
      - is_evidence
      - is_decision
      - is_memory
      - is_apu_write
      - authorizes_external_effect
    properties:
      is_fact: { const: false }
      is_evidence: { const: false }
      is_decision: { const: false }
      is_memory: { const: false }
      is_apu_write: { const: false }
      authorizes_external_effect: { const: false }
allOf:
  - if:
      properties:
        operation: { const: add_match_to_existing_object }
      required: [operation]
    then:
      required: [source_representation, identity_relation_claim, expected_object_revision]
      not:
        anyOf:
          - required: [claim]
          - required: [claim_family]
          - required: [superseded_claim_ref]
          - required: [stable_object]
          - required: [retirement]
  - if:
      properties:
        operation: { enum: [add_claim, supersede_claim] }
      required: [operation]
    then:
      required: [claim_family, claim]
      not:
        anyOf:
          - required: [source_representation]
          - required: [identity_relation_claim]
          - required: [expected_object_revision]
          - required: [stable_object]
          - required: [retirement]
  - if:
      properties:
        operation: { const: add_object }
      required: [operation]
    then:
      required: [stable_object, source_representation, identity_relation_claim]
      not:
        anyOf:
          - required: [expected_object_revision]
          - required: [claim]
          - required: [claim_family]
          - required: [superseded_claim_ref]
          - required: [retirement]
  - if:
      properties:
        operation: { const: retire_object }
      required: [operation]
    then:
      required: [retirement, expected_object_revision]
      not:
        anyOf:
          - required: [source_representation]
          - required: [identity_relation_claim]
          - required: [stable_object]
          - required: [claim]
          - required: [claim_family]
          - required: [superseded_claim_ref]
  - if:
      properties:
        operation: { const: supersede_claim }
      required: [operation]
    then:
      required: [superseded_claim_ref]
    else:
      not:
        required: [superseded_claim_ref]
x-boundary:
  runtime_execution: false
  provider_routing: false
  memory_promotion: false
  automatic_apu_write: false
  automatic_canonization: false
  approval_engine: false
