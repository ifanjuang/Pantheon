$schema: "https://json-schema.org/draft/2020-12/schema"
title: Architecture Project Understanding Derivation Record
description: >-
  V0.2 provenance record describing how one or more attribute/relation claims were
  produced from other observations, claims, calibrations or deterministic inputs.
  It records a method; it never executes that method and grants no authority.
type: object
additionalProperties: false
required: [derivation_id, produces, method]
properties:
  derivation_id:
    type: string
    minLength: 1
  produces:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      $ref: "shared.schema.yaml#/$defs/apu_claim_ref"
  method:
    type: string
    minLength: 1
    pattern: "^[a-z][a-z0-9_.-]*$"
  method_version:
    type: string
    minLength: 1
  inputs:
    type: array
    description: >-
      Stable references to input claims, source representations, calibrations,
      detections or other immutable provenance records.
    default: []
    items:
      type: string
      minLength: 1
  binding_ref:
    type: string
    minLength: 1
  adapter_version:
    type: string
    minLength: 1
  deterministic:
    type: boolean
    default: false
  method_penalty:
    type: number
    description: Optional numerical confidence penalty computed by the method.
    exclusiveMinimum: 0
    maximum: 1
  rule:
    type: string
    description: Human-readable formula/rule/method summary for audit.
  produced_certainty_score:
    type: number
    minimum: 0
    maximum: 1
    description: >-
      Optional internal numerical score. Governance certainty remains the E0-E4
      value carried by the produced claim; this score is not itself an approval.
  produced_tolerance:
    type: object
    additionalProperties: true
  notes:
    type: string
  governance_refs:
    type: array
    items: { type: string }
    default:
      - docs/domain-packs/architecture/PROJECT_ANATOMY_MODEL.md
      - schemas/architecture-project-understanding/shared.schema.yaml
x-boundary:
  runtime_execution: false
  provider_routing: false
  memory_promotion: false
  automatic_canonization: false
  approval_engine: false
