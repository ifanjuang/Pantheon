$schema: "https://json-schema.org/draft/2020-12/schema"
title: Architecture Project Understanding Relation Claim
description: >-
  V0.2 canonical relationship assertion between typed APU entities. It carries
  provenance, proof posture and validity like an attribute claim. It is also the
  canonical carrier for source-representation to stable-object identity alignment.
type: object
additionalProperties: false
required:
  - relation_claim_id
  - subject_ref
  - relation_type
  - object_ref
  - assertion_mode
  - source_authority
  - proof_status
properties:
  relation_claim_id:
    type: string
    minLength: 1
  subject_ref:
    $ref: "shared.schema.yaml#/$defs/apu_entity_ref"
  relation_type:
    $ref: "shared.schema.yaml#/$defs/relation_type"
  object_ref:
    $ref: "shared.schema.yaml#/$defs/apu_entity_ref"
  qualifier:
    type: object
    additionalProperties: true
  assertion_mode:
    $ref: "shared.schema.yaml#/$defs/assertion_mode"
  source_authority:
    $ref: "shared.schema.yaml#/$defs/source_authority_level"
  proof_status:
    $ref: "shared.schema.yaml#/$defs/proof_status"
  certainty:
    $ref: "shared.schema.yaml#/$defs/certainty"
  source_representation_refs:
    type: array
    uniqueItems: true
    default: []
    items:
      type: string
      minLength: 1
  derivation_refs:
    type: array
    uniqueItems: true
    default: []
    items:
      type: string
      minLength: 1
  evidence_refs:
    type: array
    default: []
    items:
      $ref: "shared.schema.yaml#/$defs/evidence_ref"
  supersedes_claim_ref:
    type: string
    minLength: 1
  validity:
    type: object
    additionalProperties: false
    properties:
      established_at_phase:
        $ref: "shared.schema.yaml#/$defs/phase_code"
      source_version_ref:
        type: string
        minLength: 1
      valid_from:
        $ref: "shared.schema.yaml#/$defs/date_time"
      valid_until:
        $ref: "shared.schema.yaml#/$defs/date_time"
      invalidated_by_claim_ref:
        type: string
        minLength: 1
  notes:
    type: string
  governance_refs:
    type: array
    items: { type: string }
    default:
      - docs/domain-packs/architecture/PROJECT_ANATOMY_MODEL.md
      - docs/domain-packs/architecture/PROJECT_ANATOMY_BASELINE_DECISION.md
      - schemas/architecture-project-understanding/shared.schema.yaml
allOf:
  - if:
      properties:
        relation_type: { const: identity.represents }
      required: [relation_type]
    then:
      properties:
        subject_ref:
          type: object
          required: [entity_type, entity_id]
          properties:
            entity_type: { const: source_representation }
            entity_id: { type: string, minLength: 1 }
          additionalProperties: false
        object_ref:
          type: object
          required: [entity_type, entity_id]
          properties:
            entity_type: { const: stable_object }
            entity_id: { type: string, minLength: 1 }
          additionalProperties: false
x-boundary:
  runtime_execution: false
  provider_routing: false
  memory_promotion: false
  automatic_canonization: false
  approval_engine: false
