$schema: "https://json-schema.org/draft/2020-12/schema"
$id: https://pantheon.local/schemas/architecture-project-understanding/phase_profile.schema.yaml
title: Project Anatomy Phase Profile Registry
description: >-
  Specialized registry schema for the phase code vocabulary used by Project
  Anatomy claims and requirements and by proof-register records, in two
  variants selected by registry_kind: the governed repository registry
  (`vocabulary`) and the add-only agency file (`vocabulary_overlay`) that an
  agency keeps outside the repository. A phase code names a stage of a project
  or a non-project scope marker; it never schedules, authorizes or approves
  anything. Declaring a code does not make any claim true, admitted, Evidence
  or approved; it only makes the identifier governable.
oneOf:
  - $ref: "#/$defs/registry"
  - $ref: "#/$defs/agency_file"
$defs:
  phase_id:
    type: string
    pattern: "^[A-Z][A-Z0-9_]{1,39}$"
  entry:
    type: object
    additionalProperties: false
    required: [id, status, category, label, description]
    properties:
      id:
        $ref: "#/$defs/phase_id"
      status:
        type: string
        enum: [active, candidate, deprecated]
      category:
        description: >-
          mission_element: an element of the architect's mission;
          project_stage: an agency stage of a project that is not a mission
          element; non_project_scope: a scope marker for material outside any
          project, which a project can never declare as one of its phases.
        type: string
        enum: [mission_element, project_stage, non_project_scope]
      label:
        type: string
        minLength: 1
        maxLength: 120
      description:
        type: string
        minLength: 1
        maxLength: 600
      replaced_by:
        $ref: "#/$defs/phase_id"
      aliases:
        description: >-
          Other spellings accepted for this code (for example PC for DPC). A
          value given as an alias is read as this code; an alias is never a
          code of its own and never a fuzzy match.
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: "#/$defs/phase_id"
  agency_entry:
    description: >-
      An agency entry can only add a project phase: it is active or candidate,
      it is a mission element or a project stage, and it cannot be deprecated
      or point to a replacement.
    type: object
    additionalProperties: false
    required: [id, status, category, label, description]
    properties:
      id:
        $ref: "#/$defs/phase_id"
      status:
        type: string
        enum: [active, candidate]
      category:
        type: string
        enum: [mission_element, project_stage]
      label:
        type: string
        minLength: 1
        maxLength: 120
      description:
        type: string
        minLength: 1
        maxLength: 600
  registry:
    type: object
    additionalProperties: false
    required:
      - schema_version
      - registry_id
      - registry_kind
      - version
      - status
      - owner
      - authority_document
      - governance_refs
      - description
      - profile
      - naming_rules
      - entries
      - x_boundary
    properties:
      schema_version:
        const: "1"
      registry_id:
        const: architecture_phase_profile
      registry_kind:
        const: vocabulary
      version:
        type: string
        pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
      status:
        type: string
        enum: [candidate, active, under_review, deprecated, superseded]
      owner:
        type: object
        additionalProperties: false
        required: [id, repository]
        properties:
          id:
            type: string
            minLength: 1
          repository:
            type: string
            enum: [Pantheon-Next]
      authority_document:
        type: string
        pattern: "^(docs|registries|schemas)/.+"
      governance_refs:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          pattern: "^(docs|registries|schemas)/.+"
      description:
        type: string
        minLength: 1
      profile:
        type: object
        additionalProperties: false
        required: [id, governs, agency_file]
        properties:
          id:
            type: string
            pattern: "^[a-z][a-z0-9_]*@[0-9]+$"
          governs:
            type: string
            minLength: 1
          agency_file:
            type: object
            additionalProperties: false
            required: [environment_variable, registry_kind, extends, rules]
            properties:
              environment_variable:
                type: string
                pattern: "^[A-Z][A-Z0-9_]*$"
              registry_kind:
                const: vocabulary_overlay
              extends:
                const: architecture_phase_profile
              rules:
                type: array
                minItems: 1
                items:
                  type: string
                  minLength: 1
      naming_rules:
        type: object
        additionalProperties: false
        required: [id_pattern, max_agency_entries]
        properties:
          id_pattern:
            const: "^[A-Z][A-Z0-9_]{1,39}$"
          max_agency_entries:
            type: integer
            minimum: 1
            maximum: 1000
      entries:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/entry"
      x_boundary:
        type: object
        additionalProperties: false
        required:
          - runtime_execution
          - provider_routing
          - task_authorization
          - approval
          - evidence_promotion
          - memory_promotion
        properties:
          runtime_execution: { const: false }
          provider_routing: { const: false }
          task_authorization: { const: false }
          approval: { const: false }
          evidence_promotion: { const: false }
          memory_promotion: { const: false }
  agency_file:
    type: object
    additionalProperties: false
    required: [registry_kind, extends, entries]
    properties:
      registry_kind:
        const: vocabulary_overlay
      extends:
        const: architecture_phase_profile
      description:
        type: string
        maxLength: 600
      entries:
        type: array
        maxItems: 100
        items:
          $ref: "#/$defs/agency_entry"
      aliases:
        description: >-
          Agency spellings, each naming a phase declared by the repository
          registry or by this file. An alias cannot be a declared code or an
          alias of the repository registry.
        type: object
        maxProperties: 100
        propertyNames:
          $ref: "#/$defs/phase_id"
        additionalProperties:
          $ref: "#/$defs/phase_id"
