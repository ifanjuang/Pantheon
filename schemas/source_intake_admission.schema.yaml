$schema: "https://json-schema.org/draft/2020-12/schema"
title: Pantheon Next Source Intake Admission
description: >-
  Governance contract for preserving an incoming Source before semantic
  understanding, project qualification or documentary ingestion. Source is the
  canonical intake identity. Piece is only a possible business/UX qualification
  for documentary material. This schema does not parse, classify, create an
  Information, mutate a Project, admit Evidence or execute a runtime.
type: object
required:
  - source_id
  - source_kind
  - origin
  - raw_source_ref
  - received_at
  - project_link_status
properties:
  source_id:
    type: string
    pattern: "^[a-z0-9._-]+$"
  source_kind:
    type: string
    enum:
      - email
      - document
      - image
      - audio
      - video
      - model
      - url
      - text
      - archive
      - event
      - other
    description: Coarse intake kind; not a professional document type or Information category.
  origin:
    type: object
    required: [system, external_ref]
    properties:
      system:
        type: string
        minLength: 1
        description: Origin system such as upload, gmail, paperless, filesystem, revit or api.
      external_ref:
        type: string
        minLength: 1
        description: Stable source-system reference when available.
      producer:
        type: [string, "null"]
      received_by:
        type: [string, "null"]
    additionalProperties: false
  raw_source_ref:
    type: string
    minLength: 1
    description: >-
      Opaque pointer to preserved bytes, external content or a native record. It is
      not proof of availability, validity, applicability or project membership.
  received_at:
    type: string
    format: date-time
  project_link_status:
    type: string
    enum:
      - unassigned
      - suggested
      - linked
      - excluded
    description: Project-link posture only; it is not the source processing lifecycle.
  project_ref:
    type: [string, "null"]
    minLength: 1
    description: Explicit linked Project identity. Required only when status is linked.
  declared_project_name:
    type: [string, "null"]
  candidate_project_refs:
    type: array
    default: []
    items:
      type: object
      required:
        - project_ref
        - score
        - basis
        - producer
        - created_at
      properties:
        project_ref:
          type: string
          minLength: 1
        score:
          type: number
          minimum: 0
          maximum: 1
        basis:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
        producer:
          type: string
          minLength: 1
        created_at:
          type: string
          format: date-time
      additionalProperties: false
  source_date:
    type: [string, "null"]
    format: date-time
  mime_type:
    type: [string, "null"]
  checksum:
    type: [string, "null"]
    pattern: "^[A-Fa-f0-9]{64}$"
    description: Optional SHA-256 digest of preserved bytes when bytes exist.
  confidentiality:
    type: [string, "null"]
  metadata:
    type: object
    default: {}
    description: Bounded origin metadata; never a substitute for typed semantic state.
  governance_refs:
    type: array
    items:
      type: string
    default:
      - docs/governance/SOURCE_INTAKE_ADMISSION.md
      - docs/governance/DOSSIER_SITUATION_INTAKE.md
      - docs/governance/AGENCY_DATA_SYSTEM_OF_RECORD.md
additionalProperties: false
allOf:
  - if:
      properties:
        project_link_status:
          const: linked
      required: [project_link_status]
    then:
      required: [project_ref]
      properties:
        project_ref:
          type: string
          minLength: 1
  - if:
      properties:
        project_link_status:
          const: suggested
      required: [project_link_status]
    then:
      properties:
        candidate_project_refs:
          minItems: 1
  - if:
      properties:
        project_link_status:
          enum: [unassigned, excluded]
      required: [project_link_status]
    then:
      properties:
        project_ref:
          type: "null"
x-boundary:
  runtime_execution: false
  autonomous_loop: false
  provider_routing: false
  scheduler: false
  queue_system: false
  memory_promotion: false
  automatic_canonization: false
  evidence_admission: false
  automatic_ingestion: false
  semantic_extraction: false
  information_creation: false
  project_creation: false
  system_of_record_mutation: false
