$schema: "https://json-schema.org/draft/2020-12/schema"
title: Pantheon Fragment Qualification Candidate
description: >-
  Candidate semantic qualification of document fragments produced by Hermes or
  another reviewed analyzer. The object remains derived review material. It does
  not mutate Document Structure, canonize project facts, admit Evidence or write
  Architecture Project Understanding objects.
type: object
required:
  - candidate_id
  - document_ref
  - structure_ref
  - producer
  - status
  - qualifications
  - created_at
  - authority
properties:
  candidate_id:
    $ref: "#/$defs/governed_id"
  document_ref:
    $ref: "#/$defs/governed_id"
  structure_ref:
    $ref: "#/$defs/governed_id"
  producer:
    type: object
    required: [capability, implementation]
    properties:
      capability:
        const: architecture-project-understanding
      implementation:
        type: string
        minLength: 1
      model_ref:
        type: string
        minLength: 1
      skill_version:
        type: string
        minLength: 1
    additionalProperties: false
  status:
    type: string
    enum: [generated_unreviewed, needs_review]
  qualifications:
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/qualification"
  open_questions:
    type: array
    uniqueItems: true
    items:
      type: string
      minLength: 1
  limitations:
    type: array
    uniqueItems: true
    items:
      type: string
      minLength: 1
  created_at:
    type: string
    format: date-time
  authority:
    type: object
    required:
      - mutates_document_structure
      - is_project_fact
      - is_evidence
      - is_apu_write
      - is_professional_validation
    properties:
      mutates_document_structure: { const: false }
      is_project_fact: { const: false }
      is_evidence: { const: false }
      is_apu_write: { const: false }
      is_professional_validation: { const: false }
    additionalProperties: false
additionalProperties: false
$defs:
  governed_id:
    type: string
    pattern: "^[a-z0-9][a-z0-9._-]*$"
  qualification:
    type: object
    required:
      - fragment_ref
      - certainty
      - rationale
    properties:
      fragment_ref:
        $ref: "#/$defs/governed_id"
      topic:
        type: string
        minLength: 1
      discipline:
        type: string
        minLength: 1
      representation_kind:
        type: string
        enum:
          - site_plan
          - floor_plan
          - roof_plan
          - reflected_ceiling_plan
          - structural_plan
          - network_plan
          - section
          - elevation
          - detail
          - diagram
          - perspective
          - axonometric
          - sketch
          - schedule
          - report_section
          - other
      project_state:
        type: string
        enum: [existing, to_demolish, projected, temporary, as_built, unknown]
      variant_ref:
        type: string
        minLength: 1
      coverage_refs:
        type: array
        uniqueItems: true
        items:
          type: string
          minLength: 1
      supporting_fragment_refs:
        type: array
        uniqueItems: true
        items:
          $ref: "#/$defs/governed_id"
      opposing_fragment_refs:
        type: array
        uniqueItems: true
        items:
          $ref: "#/$defs/governed_id"
      certainty:
        type: string
        enum: [E0, E1, E2, E3, E4]
      rationale:
        type: string
        minLength: 1
      question:
        type: string
        minLength: 1
    anyOf:
      - required: [topic]
      - required: [discipline]
      - required: [representation_kind]
      - required: [project_state]
      - required: [variant_ref]
      - required: [coverage_refs]
    additionalProperties: false
x-boundary:
  runtime_execution: false
  persistence_execution: false
  document_structure_mutation: false
  automatic_evidence_admission: false
  automatic_apu_write: false
  automatic_approval: false
