$schema: "https://json-schema.org/draft/2020-12/schema"
title: Pantheon Signature Effect Request
description: Candidate request for a consequential external signature invitation. The request does not authorize execution.
type: object
required:
  - schema_version
  - request_id
  - created_at
  - effect
  - effect_class
  - document
  - recipients
  - provider_binding_ref
  - provider_template_ref
  - idempotency_key
  - governance
properties:
  schema_version:
    const: pantheon.signature-effect-request/v1
  request_id:
    type: string
    pattern: "^[a-z0-9._-]+$"
  created_at:
    type: string
    format: date-time
  effect:
    const: send_signature_request
  effect_class:
    const: T4
  document:
    type: object
    additionalProperties: false
    required: [source_ref, sha256]
    properties:
      source_ref:
        type: string
        minLength: 1
      sha256:
        type: string
        pattern: "^[a-f0-9]{64}$"
      revision_ref:
        type: [string, "null"]
  recipients:
    type: array
    minItems: 1
    maxItems: 20
    items:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
        name:
          type: [string, "null"]
        role:
          type: [string, "null"]
  provider_binding_ref:
    type: string
    minLength: 1
  provider_template_ref:
    type: string
    minLength: 1
  message:
    type: object
    additionalProperties: false
    properties:
      subject:
        type: string
      body:
        type: string
  idempotency_key:
    type: string
    minLength: 8
  governance:
    type: object
    additionalProperties: false
    required:
      - authorization_required
      - authorized
      - execution_performed
    properties:
      authorization_required:
        const: true
      authorized:
        const: false
      execution_performed:
        const: false
additionalProperties: false
x-boundary:
  request_is_authorization: false
  runtime_success_is_authorization: false
  external_send_effect: true
  evidence_admitted: false
  provider_selected_is_authority_transfer: false
