$schema: "https://json-schema.org/draft/2020-12/schema"
title: Pantheon Next Exposure Evidence
description: >-
  Input contract for the read-only verify_exposure policy tool. It is evidence
  already gathered elsewhere about a component's exposure surface — how far it is
  reachable, whether authentication is enforced and whether access scope is
  limited — provided to the tool, never fetched by it. The tool classifies this
  evidence into a verdict as data (guarded / degraded / exposed / unknown) and
  reports capability gaps when evidence is insufficient. It performs no probe, no
  NAS access, opens no port, sends nothing and decides nothing. Every field is
  optional and missing signals become capability gaps, but any field that is
  present is validated strictly before classification; malformed evidence
  returns an error and no positive verdict.
type: object
properties:
  component:
    type: string
    description: Name of the component whose exposure surface is being verified.
  reach:
    type: string
    enum: [local, vpn, public]
    description: >-
      Provided network reach. local / vpn are contained; public is open and, with
      no authentication, is the exposed extreme.
  auth:
    type: object
    description: Provided authentication posture. The tool opens no connection itself.
    properties:
      enforced:
        type: boolean
      detail:
        type: string
    additionalProperties: false
  scope:
    type: object
    description: Provided access scope (read-only / least-privilege vs open).
    properties:
      limited:
        type: boolean
      detail:
        type: string
    additionalProperties: false
required: []
additionalProperties: false
governance_refs:
  - docs/governance/PANTHEON_MCP_POLICY_SERVER_DEVELOPMENT.md
  - docs/governance/PANTHEON_CONTROL_BOUNDARY.md
x-boundary:
  runtime_execution: false
  decision_is_data: true
  performs_probe: false
  nas_access: false
  opens_port: false
  autonomous_loop: false
  provider_routing: false
  scheduler: false
  queue_system: false
  memory_promotion: false
  automatic_canonization: false
