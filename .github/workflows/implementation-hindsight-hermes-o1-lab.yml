name: Hindsight Hermes O1 Sandbox

on:
  pull_request:
    paths:
      - ".github/workflows/implementation-hindsight-hermes-o1-lab.yml"
      - "implementation/qualification/external-pins.json"
      - "implementation/tools/export_external_qualification_pins.py"
      - "implementation/tools/run_hindsight_hermes_o1.py"
      - "implementation/tools/run_hindsight_hermes_o1.sh"
      - "implementation/tools/hindsight_hermes_o1_fixture.py"
      - "implementation/tests/test_hindsight_hermes_o1_contract.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: implementation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: pytest -q tests/test_hindsight_hermes_o1_contract.py

  live-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      HINDSIGHT_API_URL: http://127.0.0.1:8888
      HINDSIGHT_BANK_ID: pantheon-o1-synthetic
    steps:
      - name: Checkout current monorepo candidate
        uses: actions/checkout@v4
        with:
          path: monorepo
      - name: Load canonical Hermes and Hindsight qualification pins
        shell: bash
        run: python3 monorepo/implementation/tools/export_external_qualification_pins.py --github-env "$GITHUB_ENV" hermes-agent hindsight
      - name: Expose transitional pantheon-mvp workspace alias
        shell: bash
        run: ln -s "$GITHUB_WORKSPACE/monorepo/implementation" "$GITHUB_WORKSPACE/pantheon-mvp"
      - name: Checkout exact qualified Hermes source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.HERMES_REPOSITORY }}
          ref: ${{ env.HERMES_REF }}
          path: hermes-upstream
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start ephemeral Hindsight
        shell: bash
        run: |
          docker pull "${HINDSIGHT_IMAGE}:${HINDSIGHT_VERSION}"
          docker run -d --rm \
            --name pantheon-o1-hindsight \
            -p 8888:8888 \
            -e HINDSIGHT_API_WORKER_ID=pantheon-o1-hindsight \
            -e HINDSIGHT_API_RETAIN_EXTRACTION_MODE=chunks \
            -e HINDSIGHT_API_ENABLE_AUTO_CONSOLIDATION=false \
            -e HINDSIGHT_API_ENABLE_OBSERVATIONS=false \
            -e HINDSIGHT_API_LLM_PROVIDER=openai \
            -e HINDSIGHT_API_LLM_API_KEY=unused-o1-lab-key \
            "${HINDSIGHT_IMAGE}:${HINDSIGHT_VERSION}"
          for _ in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:8888/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs pantheon-o1-hindsight
          exit 1
      - name: Execute O1 live sandbox
        working-directory: monorepo/implementation
        run: bash tools/run_hindsight_hermes_o1.sh
      - name: Capture Hindsight image identity
        if: always()
        working-directory: monorepo/implementation
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/hindsight-hermes-o1/artifacts"
          docker image inspect "${HINDSIGHT_IMAGE}:${HINDSIGHT_VERSION}" \
            --format '{{json .RepoDigests}}' \
            > "${RUNNER_TEMP}/hindsight-hermes-o1/artifacts/hindsight-image-repodigests.json" || true
          docker logs pantheon-o1-hindsight \
            > "${RUNNER_TEMP}/hindsight-hermes-o1/artifacts/hindsight.log" 2>&1 || true
      - name: Stop ephemeral Hindsight
        if: always()
        run: docker stop pantheon-o1-hindsight || true
      - name: Upload bounded observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hindsight-hermes-o1-${{ github.run_id }}
          path: ${{ runner.temp }}/hindsight-hermes-o1/artifacts/
          if-no-files-found: error
          retention-days: 14
