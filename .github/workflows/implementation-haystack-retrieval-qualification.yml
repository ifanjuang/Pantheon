name: Haystack Retrieval Qualification

on:
  pull_request:
    paths:
      - ".github/workflows/implementation-haystack-retrieval-qualification.yml"
      - "implementation/qualification/external-pins.json"
      - "implementation/tools/export_external_qualification_pins.py"
      - "implementation/labs/haystack_retrieval/**"
      - "implementation/mvp_vertical/retrieval.py"
      - "implementation/mvp_vertical/retrieval_scope.py"
      - "implementation/tests/fixtures/professional_quote_review_cases.yaml"
      - "implementation/tests/fixtures/retrieval_metier_cases.yaml"
      - "implementation/tests/test_haystack_bounded_retrieval_lab.py"
      - "implementation/tests/test_haystack_native_retrieval_comparison.py"
      - "implementation/tests/test_professional_quote_review_baseline.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-retrieval:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      pgvector:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mvp
          POSTGRES_PASSWORD: mvp
          POSTGRES_DB: mvp
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U mvp -d mvp"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - name: Checkout Pantheon qualification harness
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Load canonical Haystack qualification pin
        shell: bash
        run: python3 implementation/tools/export_external_qualification_pins.py --github-env "$GITHUB_ENV" haystack

      - name: Install bounded implementation test dependencies and exact Haystack package
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "implementation[test]"
          python -m pip install "${HAYSTACK_PACKAGE}==${HAYSTACK_VERSION}"

      - name: Verify exact package and safe deserialization posture
        shell: bash
        run: |
          python - <<'PY'
          import importlib.metadata
          import os

          expected = os.environ["HAYSTACK_VERSION"]
          observed = importlib.metadata.version("haystack-ai")
          assert observed == expected, (observed, expected)
          assert os.environ.get("HAYSTACK_UNSAFE_DESERIALIZATION", "").strip().lower() not in {"1", "true"}
          PY

      - name: Run bounded Haystack qualification
        working-directory: implementation
        env:
          HAYSTACK_UNSAFE_DESERIALIZATION: "false"
        run: pytest -q tests/test_haystack_bounded_retrieval_lab.py

      - name: Measure Haystack against current native exact-scoped retrieval
        working-directory: implementation
        env:
          HAYSTACK_UNSAFE_DESERIALIZATION: "false"
          MVP_PG_DSN: postgresql://mvp:mvp@localhost:5433/mvp
        run: pytest -q -s tests/test_haystack_native_retrieval_comparison.py
